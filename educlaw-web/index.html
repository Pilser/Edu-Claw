<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduClaw</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
</head>
<body>

  <!-- ── Login screen ──────────────────────────────────────────────────── -->
  <div id="login-screen">
    <div class="login-card">
      <h1>EduClaw</h1>
      <p class="subtitle">Student-Assisted Learning Platform</p>
      <form id="login-form" autocomplete="off">
        <input type="text"     id="username"   placeholder="Username"    required>
        <input type="password" id="password"   placeholder="Password"    required>
        <input type="text"     id="course"     placeholder="Course code" required>
        <input type="text"     id="assignment" placeholder="Assignment (optional)">
        <button type="submit">Start Session</button>
        <p id="login-error" class="error" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- ── Session screen ────────────────────────────────────────────────── -->
  <div id="session-screen" class="hidden">
    <div id="main-panels">

      <!-- Left: full xterm.js TUI -->
      <div id="terminal-panel">
        <div id="terminal-container"></div>
      </div>

      <!-- Right: file browser + content viewer (Phase 4 stub) -->
      <div id="file-panel" class="hidden">
        <div class="panel-header">
          <span>Files</span>
          <button id="close-file-panel" title="Close panel">✕</button>
        </div>
        <div id="file-tree">
          <p class="stub-note">File browser — Phase 4</p>
        </div>
        <div id="file-viewer">
          <p class="stub-note">Content viewer</p>
        </div>
      </div>

    </div>
    <div id="status-bar">
      <span id="status-dot" class="dot dot-green"></span>
      <span id="status-text">Connected</span>
      <span class="spacer"></span>
      <span id="session-label"></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script src="/api.js"></script>
  <script src="/terminal.js"></script>
</body>
</html>
