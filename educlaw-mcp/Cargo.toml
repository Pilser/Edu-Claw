[package]
name        = "educlaw-mcp"
version     = "0.1.0"
edition     = "2021"

[[bin]]
name = "educlaw-mcp"
path = "src/main.rs"

[dependencies]
# MCP framework — same version as memorymcp reference
rmcp = { version = "0.11", features = [
    "server",
    "transport-io",           # stdio transport for claw child-process launch
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# LanceDB — serverless embedded vector DB with hybrid search (vector KNN + BM25 FTS + RRF)
lancedb      = "0.27"
lance-index  = "4.0"

# Apache Arrow — LanceDB's native data format
arrow-array  = "57"
arrow-schema = "57"

# Async stream collection (stream.try_collect())
futures = "0.3"

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Embedding HTTP client (same pattern as memorymcp EmbeddingClient)
reqwest = { version = "0.11", features = ["json"] }

# Error handling & logging
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Directory walking for file-tree tools
walkdir = "2"

# Date/time for answer timestamps
chrono = { version = "0.4", features = ["serde"] }
